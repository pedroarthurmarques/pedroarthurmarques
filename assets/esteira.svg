<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-label="Esteira de release em GitHub Actions, em cinco etapas: pull request com testes, lint e build; tag de versão que gera o AAB e o IPA assinados; teste interno no Google Play, TestFlight e Firebase App Distribution; aprovação manual que promove o mesmo binário; e produção com rollout gradual. Num produto white-label, a esteira publica 8 apps em paralelo, e a falha de um não trava os outros."><title>Esteira de release em GitHub Actions, em cinco etapas: pull request com testes, lint e build; tag de versão que gera o AAB e o IPA assinados; teste interno no Google Play, TestFlight e Firebase App Distribution; aprovação manual que promove o mesmo binário; e produção com rollout gradual. Num produto white-label, a esteira publica 8 apps em paralelo, e a falha de um não trava os outros.</title><style>@font-face{font-family:FG;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:FG;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}text{font-family:FG, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;}</style><rect width="1000" height="404" rx="28" fill="#0F2B30"/><path d="M100 66H900" stroke="#2A5A62" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="66" r="22" fill="#173D44" stroke="#2A5A62" stroke-width="2"/><text x="100.0" y="72.0" font-size="17" font-weight="600" fill="#EAF3F1" text-anchor="middle">1</text><text x="100.0" y="128.0" font-size="18" font-weight="600" fill="#EAF3F1" text-anchor="middle">Pull request</text><text x="100.0" y="155.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">testes, lint e build</text><text x="100.0" y="176.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">em cada PR</text><circle cx="300" cy="66" r="22" fill="#173D44" stroke="#2A5A62" stroke-width="2"/><text x="300.0" y="72.0" font-size="17" font-weight="600" fill="#EAF3F1" text-anchor="middle">2</text><text x="300.0" y="128.0" font-size="18" font-weight="600" fill="#EAF3F1" text-anchor="middle">Tag de versão</text><text x="300.0" y="155.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">gera o AAB e o IPA</text><text x="300.0" y="176.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">assinados</text><circle cx="500" cy="66" r="22" fill="#173D44" stroke="#2A5A62" stroke-width="2"/><text x="500.0" y="72.0" font-size="17" font-weight="600" fill="#EAF3F1" text-anchor="middle">3</text><text x="500.0" y="128.0" font-size="18" font-weight="600" fill="#EAF3F1" text-anchor="middle">Teste interno</text><text x="500.0" y="155.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">Play, TestFlight e</text><text x="500.0" y="176.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">Firebase App Distribution</text><circle cx="700" cy="66" r="22" fill="#173D44" stroke="#2A5A62" stroke-width="2"/><text x="700.0" y="72.0" font-size="17" font-weight="600" fill="#EAF3F1" text-anchor="middle">4</text><text x="700.0" y="128.0" font-size="18" font-weight="600" fill="#EAF3F1" text-anchor="middle">Aprovação manual</text><text x="700.0" y="155.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">promove o mesmo binário,</text><text x="700.0" y="176.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">sem recompilar</text><circle cx="900" cy="66" r="22" fill="#FFB547" stroke="#FFB547" stroke-width="2"/><text x="900.0" y="72.0" font-size="17" font-weight="600" fill="#0F2B30" text-anchor="middle">5</text><text x="900.0" y="128.0" font-size="18" font-weight="600" fill="#EAF3F1" text-anchor="middle">Produção</text><text x="900.0" y="155.0" font-size="15.5" font-weight="400" fill="#9DBAB6" text-anchor="middle">rollout gradual e</text><text x="900.0" y="176.0" font-size="15.5" font-weight="400" fill="#9DBAB6" te